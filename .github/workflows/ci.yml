name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint + jsx-a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      # `tools/lint/` est un paquet à part : il embarque l'API TypeScript 6 que
      # @typescript-eslint exige, alors que le projet compile en TypeScript 7.
      # Voir tools/lint/index.js.
      - name: Installer la chaîne d'analyse (API TypeScript 6)
        run: npm ci --prefix tools/lint --ignore-scripts

      # Bloquant sur les erreurs (accessibilité, règles des hooks, variables
      # mortes). Les deux règles du design system sont en avertissement : leur
      # plan de résorption est décrit dans docs/design.md § 15, avec le plafond
      # d'occurrences à ne pas dépasser.
      - name: Analyser le code
        run: npm run lint

  types:
    name: Types (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      # Toute la couche API repose sur les types générés par le backend : une
      # erreur de type y est une erreur d'exécution. Contrôle bloquant, en mode
      # strict, et jamais ignoré (`npm run build` lance tsc avant Vite).
      - name: Vérifier les types
        run: npm run typecheck

  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      # `build` = `tsc --noEmit && vite build` : les erreurs de type arrêtent la
      # construction, et Rollup échoue en plus sur un import ou un export
      # introuvable — ce qui a déjà rattrapé une migration laissée à mi-chemin.
      - name: Compiler l'application
        run: npm run build

  e2e:
    name: Parcours critiques (Playwright)
    runs-on: ubuntu-latest

    # Trois parcours dont l'échec coûterait le plus cher : s'inscrire AU
    # CLAVIER (la case CGU était inatteignable — personne ne pouvait créer de
    # compte sans souris), déposer une pièce, signer un document. Les tests
    # doublent l'API : ni base de données, ni PHP, ni jeu de données à
    # maintenir. Voir playwright.config.ts.
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Installer le navigateur
        run: npx playwright install --with-deps chromium

      - name: Jouer les parcours
        run: npm run test:e2e

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  stockage-navigateur:
    name: Garde localStorage
    runs-on: ubuntu-latest

    # Toute la migration visait à sortir les données métier du navigateur. Sans
    # garde-fou, un simple `localStorage.setItem` réintroduit sans bruit un état
    # local que le serveur ignore, et les deux se contredisent en silence.
    steps:
      - uses: actions/checkout@v4

      - name: Seul le module API peut écrire dans le navigateur
        run: |
          ECRITURE='localStorage[[:space:]]*\.[[:space:]]*(setItem|removeItem|clear)'
          TROUVES=$(grep -rlE "$ECRITURE" src --include='*.ts' --include='*.tsx' \
                    | grep -v '^src/imports/' | sort || true)
          # Les avatars passent désormais par POST/DELETE /auth/avatar : plus
          # aucune exception hors jeton de session.
          AUTORISES='src/app/api/client.ts'

          if [ "$TROUVES" != "$AUTORISES" ]; then
            echo "::error::Écriture localStorage inattendue."
            echo "Seul ce module peut écrire dans le navigateur :"
            echo "  src/app/api/client.ts → cpi_api_token (jeton d'authentification)"
            echo
            echo "Trouvé :"
            printf '%s\n' "$TROUVES" | sed 's/^/  /'
            echo
            echo "Toute autre donnée appartient à l'API. Si une nouvelle clé est"
            echo "réellement justifiée, ajoutez-la à cette liste dans le même commit."
            exit 1
          fi
          echo "✓ Écritures navigateur limitées au jeton de session."

      - name: Le jeton d'authentification reste confiné à la couche API
        run: |
          # Le jeton ne doit jamais être lu, exporté ou effacé ailleurs : il a
          # déjà fuité une fois dans une sauvegarde JSON téléchargeable.
          FUITES=$(grep -rn "cpi_api_token" src --include='*.ts' --include='*.tsx' \
                   | grep -v '^src/imports/' | grep -v '^src/app/api/client.ts:' || true)
          if [ -n "$FUITES" ]; then
            echo "::error::cpi_api_token référencé hors de src/app/api/client.ts."
            printf '%s\n' "$FUITES" | sed 's/^/  /'
            echo
            echo "Passez par getToken/setToken/clearToken plutôt que par la clé brute."
            exit 1
          fi
          echo "✓ Jeton confiné à src/app/api/client.ts."

  types-generes:
    name: Types générés à jour
    runs-on: ubuntu-latest

    # generated.d.ts est produit par `php artisan typescript:transform` côté
    # backend. Édité à la main, il ment sur la forme réelle des réponses.
    steps:
      - uses: actions/checkout@v4

      - name: Le fichier généré ne doit pas être édité à la main
        run: |
          FICHIER=src/app/api/types/generated.d.ts
          if [ ! -f "$FICHIER" ]; then
            echo "::error::$FICHIER est absent — la couche API ne compilera pas."
            exit 1
          fi
          if ! head -5 "$FICHIER" | grep -qi "generated\|généré"; then
            echo "::warning::$FICHIER ne porte plus son en-tête de fichier généré."
          fi
          echo "✓ Types générés présents."

# ─────────────────────────────────────────────────────────────────────────────
# Prettier n'est PAS vérifié ici. La configuration existe (`npm run format`),
# mais le code n'a pas été reformaté : 53 fichiers changeraient d'un coup.
# La bascule est prévue en commit dédié — voir docs/design.md § 15 —, et
# `format:check` deviendra bloquant dans ce même commit.
# ─────────────────────────────────────────────────────────────────────────────
# `src/app/components/ui/**` (hors index.tsx) est exclu du contrôle de types :
# échafaudage shadcn/Figma jamais importé, aux specifiers versionnés
# (`lucide-react@0.487.0`…) que ni Vite ni tsc ne savent résoudre. Le jour où
# l'un de ces composants sert vraiment, corrigez ses imports et retirez
# l'exclusion de tsconfig.json plutôt que de contourner le contrôle.
# ─────────────────────────────────────────────────────────────────────────────
