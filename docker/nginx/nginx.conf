# =============================================================================
# nginx — configuration principale (MONESPACE.CPI, SPA statique)
#
# Tourne au premier plan dans le conteneur. Tout est journalisé sur
# stdout/stderr : `docker logs` est le seul endroit à regarder.
# =============================================================================

user nginx;

# Un worker par cœur ; chacun est mono-thread et événementiel.
worker_processes auto;
worker_rlimit_nofile 8192;

pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Journalisation ------------------------------------------------------
    # rt / urt distinguent « l'API a été lente » de « nginx attendait ».
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout main buffer=32k flush=5s;

    # --- Transfert -----------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    keepalive_timeout 65;
    keepalive_requests 1000;

    # Protection contre les clients lents. Assez large pour une vidéo de
    # chantier de 50 Mo sur une connexion faible (l'upload traverse le proxy).
    client_body_timeout 120s;
    client_header_timeout 15s;
    send_timeout 60s;
    reset_timedout_connection on;

    # Doit rester >= client_max_body_size du backend (60m) : les dépôts de
    # fichiers passent par le proxy /api.
    client_max_body_size 60m;
    client_body_buffer_size 256k;

    # --- Cache de métadonnées des fichiers statiques -------------------------
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- IP réelle derrière le terminateur TLS -------------------------------
    # À RESTREINDRE au CIDR du proxy si le port devient joignable au-delà du
    # loopback de l'hôte.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
