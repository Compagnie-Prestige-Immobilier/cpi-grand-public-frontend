# =============================================================================
# MONESPACE.CPI — frontend (nginx statique + proxy /api)
#
# Prérequis : la stack backend tourne déjà (`docker compose up` dans backend/),
# car ce service rejoint son réseau (`cpi_cpi`) pour proxifier /api vers le
# conteneur cpi_api. Ainsi le navigateur ne parle qu'à UNE origine — pas de
# CORS en production.
#
#   docker compose up -d --build
# =============================================================================

name: cpi-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Adresse publique (URL canonique, sitemap) — résolue AU BUILD.
        VITE_SITE_URL: ${VITE_SITE_URL:-https://monespace.cpi.sn}
        # Identifiant GA (vide = aucun script de suivi injecté).
        VITE_GTAG_ID: ${VITE_GTAG_ID:-}
    image: cpi-frontend:latest
    container_name: cpi_web
    restart: unless-stopped
    # Loopback uniquement : le proxy TLS de l'hôte termine HTTPS et forward ici.
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    environment:
      # Backend joint par son URL PUBLIQUE : aucune dépendance à un réseau
      # Docker partagé, les deux stacks se déploient et redémarrent séparément.
      # API_HOST doit être l'hôte de API_ORIGIN (en-tête Host + SNI TLS).
      API_ORIGIN: ${API_ORIGIN:-https://api.cpi.sn}
      API_HOST: ${API_HOST:-api.cpi.sn}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# Aucun réseau externe : ce service n'a plus besoin de la stack backend pour
# démarrer. Déclarer `cpi_cpi` en external faisait échouer `docker compose up`
# dès que ce réseau n'existait pas sous ce nom exact — compose s'arrêtait avant
# de créer le conteneur, et le domaine ne répondait plus que 502.
# Compose crée son propre réseau de projet, ce qui suffit ici.
