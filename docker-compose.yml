# =============================================================================
# MONESPACE.CPI — frontend (nginx statique + proxy /api)
#
# Prérequis : la stack backend tourne déjà (`docker compose up` dans backend/),
# car ce service rejoint son réseau (`cpi_cpi`) pour proxifier /api vers le
# conteneur cpi_api. Ainsi le navigateur ne parle qu'à UNE origine — pas de
# CORS en production.
#
#   docker compose up -d --build
# =============================================================================

name: cpi-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Adresse publique (URL canonique, sitemap) — résolue AU BUILD.
        VITE_SITE_URL: ${VITE_SITE_URL:-https://monespace.cpi.sn}
        # Identifiant GA (vide = aucun script de suivi injecté).
        VITE_GTAG_ID: ${VITE_GTAG_ID:-}
    image: cpi-frontend:latest
    container_name: cpi_web
    restart: unless-stopped
    # Loopback uniquement : le proxy TLS de l'hôte termine HTTPS et forward ici.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    environment:
      # Nom DNS du backend sur le réseau partagé (container_name du service app).
      API_ORIGIN: http://cpi_api:80
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  # Réseau créé par backend/docker-compose.yml (projet `cpi`, réseau `cpi`).
  backend:
    external: true
    name: cpi_cpi
